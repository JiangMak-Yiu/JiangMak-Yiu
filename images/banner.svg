<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#bc8cff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.2" r="0.5">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#30363d"/>
    </pattern>
  </defs>

  <rect width="900" height="280" fill="url(#bg)"/>
  <rect width="900" height="280" fill="url(#dots)"/>
  <rect width="900" height="280" fill="url(#glow)"/>

  <!-- 装饰圆环 -->
  <circle cx="760" cy="130" r="86" fill="none" stroke="#30363d" stroke-width="1.5"/>
  <circle cx="760" cy="130" r="58" fill="none" stroke="#21262d" stroke-width="1.5"/>
  <circle cx="760" cy="130" r="8" fill="#bc8cff"/>
  <circle cx="820" cy="60" r="4" fill="#58a6ff"/>
  <circle cx="680" cy="210" r="5" fill="#58a6ff" opacity="0.7"/>
  <circle cx="850" cy="200" r="3" fill="#bc8cff" opacity="0.6"/>

  <!-- 底部波浪 -->
  <path d="M0 250 Q 112 228 225 248 T 450 250 T 675 246 T 900 250 L 900 280 L 0 280 Z" fill="#21262d" opacity="0.55"/>
  <path d="M0 262 Q 150 244 300 260 T 600 260 T 900 258 L 900 280 L 0 280 Z" fill="#161b22" opacity="0.7"/>

  <!-- 文字 -->
  <text x="52" y="128" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="54" font-weight="700" fill="#e6edf3">江秋寒</text>
  <text x="56" y="172" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="22" fill="#8b949e">JiangMak-Yiu</text>

  <rect x="56" y="196" width="64" height="3" rx="1.5" fill="url(#accent)"/>

  <text x="56" y="232" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#c9d1d9">站长 · 全栈开发者 · 服务器玩家</text>

  <!-- 标签 -->
  <rect x="56" y="246" width="86" height="22" rx="11" fill="#21262d"/>
  <circle cx="72" cy="257" r="4" fill="#3fb950"/>
  <text x="84" y="262" font-family="'Segoe UI', sans-serif" font-size="12" fill="#8b949e">Online</text>
</svg>
