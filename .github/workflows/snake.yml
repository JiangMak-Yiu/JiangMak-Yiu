name: generate-snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk@v3
        with:
          github_user_name: JiangMak-Yiu
          outputs: |
            dist/snake-light.svg
            dist/snake-dark.svg

      - name: move files
        run: |
          mkdir -p images
          cp dist/snake-dark.svg images/snake.svg
          cp dist/snake-light.svg images/snake-light.svg

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update contribution snake"
          file_pattern: images/snake*.svg
